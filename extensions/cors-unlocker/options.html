<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WatchParty CORS Unlocker</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; height: 12rem; font: 13px ui-monospace, monospace; }
      button { margin-top: .5rem; padding: .3rem .9rem; }
      #status { margin-left: .5rem; color: #555; }
    </style>
  </head>
  <body>
    <h1>WatchParty CORS Unlocker</h1>
    <p>Video servers to unlock for WatchParty, one domain per line (subdomains included). If WatchParty says
      a server blocks browser streaming, add the host it names here.</p>
    <textarea id="domains" spellcheck="false"></textarea>
    <div><button id="save">Save</button><button id="reset">Reset to defaults</button><span id="status"></span></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
